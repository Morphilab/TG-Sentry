[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-sentry"
version = "0.1.0"
description = "Monitor y limpiador de cuenta de Telegram — seguro por diseño (dry-run por defecto, auditoría, límites anti-baneo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "morphilab" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    # Versiones FIJAS (decisión documentada internamente; sin rangos):
    # mantenimiento reducido de Telethon desde ~2023 → sin rangos, revisión a 6 meses.
    "telethon==1.45.0",
    "textual==8.2.8",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "tomlkit==0.15.1",
]

[project.scripts]
tg-sentry = "tg_sentry.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tg_sentry"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["tg_sentry"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = "telethon.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
